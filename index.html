<script>
let totalInch=0,totalFeet=0,totalGazz=0;

/* UPDATE BILL TITLE */
function updateBillTitle(){
  const title=document.getElementById("billTitleInput").value || "AH-Hamaam Construction";
  document.getElementById("billTitle").innerText=title;
}

/* AUTO SPACE */
function handleInput(el){
  let clean=el.value.replace(/\D/g,'');
  let grouped=clean.match(/.{1,4}/g);
  el.value=grouped?grouped.join(' '):'';
  formatExpression(clean);
}

/* SHOW STONES */
function formatExpression(clean){
  let exp="", stones="", i=0, c=0;

  while(i+3<clean.length){
    let w=clean.substring(i,i+2);
    let b=clean.substring(i+2,i+4);
    exp+=w+" × "+b+" | ";
    c++;
    stones+=`<div>Stone ${c}: ${w} × ${b}</div>`;
    i+=4;
  }

  document.getElementById("expression").innerText=exp.replace(/\| $/,'');
  document.getElementById("stonesBox").innerHTML=
    c?`<b>Total Stones: ${c}</b><br>${stones}`:'';
}

/* CALCULATIONS */
function calculateInches(){
  let input=document.getElementById("rawInput").value.replace(/\D/g,'');
  totalInch=0;
  for(let i=0;i+3<input.length;i+=4){
    totalInch+=Number(input.substring(i,i+2))*Number(input.substring(i+2,i+4));
  }
  document.getElementById("inchResult").innerText="Total Inch² : "+totalInch;
}

function convertToFeet(){
  totalFeet=(totalInch/144).toFixed(2);
  document.getElementById("feetResult").innerText="Square Feet : "+totalFeet;
}

function convertToGazz(){
  totalGazz=(totalFeet/9).toFixed(2);
  document.getElementById("gazzResult").innerText="Total Gazz : "+totalGazz;
}

function calculateAmount(){
  let rate=Number(document.getElementById("rate").value);
  if(!rate) return alert("Enter rate per gazz");
  document.getElementById("amountResult").innerText=
    "Total Amount : ₹ "+(totalGazz*rate).toFixed(2);
}

/* PRINT */
function printHisaab(){
  document.getElementById("dateBox").innerText=
    "Date : "+new Date().toLocaleDateString();
  window.print();
}
</script>
