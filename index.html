<!DOCTYPE html>
<html lang="en">
<head>
  <!-- BASIC SEO -->
  <meta name="title" content="Yasir Hamid – AH-Hamaam Construction Calculator">
  <meta name="description" content="Official AH-Hamaam Construction Calculator by Yasir Hamid. Calculate hamaam stones, inches, square feet, gazz, and total cost easily.">
  <meta name="keywords" content="Yasir Hamid, Yasir Calculator, Hamaam Calculator, AH-Hamaam Calculator, Gazz Calculator">
  <meta name="author" content="Yasir Hamid">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AH-Hamaam Construction Calculator</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3064/3064197.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }

    .wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #020617, #020617);
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.9);
    }

    h2 {
      text-align: center;
      color: #e5c9a6;
      margin-bottom: 6px;
    }

    .dev-mini {
      font-size: 8px;
      text-align: center;
      margin-bottom: 14px;
    }

    .dev-mini a {
      color: #e5c9a6;
      text-decoration: none;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #000;
      color: #fff;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      background: #6b4f2a;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .box {
      text-align: center;
      margin-top: 6px;
      font-size: 14px;
    }

    .result {
      color: #22c55e;
      font-weight: bold;
    }

    #stonesBox {
      margin-top: 8px;
      font-size: 13px;
      color: #cbd5f5;
    }

    .print-btn {
      margin-top: 14px;
      background: #6b4f2a;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }

    footer a {
      color: #e5c9a6;
      text-decoration: none;
      font-weight: bold;
    }

    /* ===== PRINT ===== */
    @media print {
      body {
        background: #fff;
        color: #000;
      }
      input, button, footer {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="wrapper">
  <div class="container" id="printArea">

    <input
      type="text"
      id="billTitleInput"
      value="AH-Hamaam Construction"
      placeholder="Enter Bill Title"
      oninput="updateBillTitle()"
    >

    <h2 id="billTitle">AH-Hamaam Construction</h2>

    <div class="dev-mini">
      Developed by
      <a href="https://yasirhamid.netlify.app/">Yasir Hamid</a>
    </div>

    <input
      type="text"
      id="rawInput"
      placeholder="Enter numbers only (in inches)"
      oninput="handleInput(this)"
    >

    <div class="box" id="expression"></div>
    <div id="stonesBox"></div>

    <button onclick="calculateInches()">Calculate Inches</button>
    <div class="box result" id="inchResult"></div>

    <button onclick="convertToFeet()">Convert to Sq Feet</button>
    <div class="box result" id="feetResult"></div>

    <button onclick="convertToGazz()">Convert to Gazz</button>
    <div class="box result" id="gazzResult"></div>

    <input type="number" id="rate" placeholder="Rate per Gazz (optional)">
    <button onclick="calculateAmount()">Calculate Amount</button>
    <div class="box result" id="amountResult"></div>

    <div class="box" id="dateBox"></div>

    <button class="print-btn" onclick="printHisaab()">Print Hisaab</button>

    <footer>
      Better full bill available at
      <a href="https://hamaamcal.netlify.app/" target="_blank">
        hamaamcal.netlify.app
      </a>
    </footer>

  </div>
</div>

<script>
let totalInch=0,totalFeet=0,totalGazz=0;

function updateBillTitle(){
  const title=document.getElementById("billTitleInput").value || "AH-Hamaam Construction";
  document.getElementById("billTitle").innerText=title;
}

function handleInput(el){
  let clean=el.value.replace(/\D/g,'');
  let grouped=clean.match(/.{1,4}/g);
  el.value=grouped?grouped.join(' '):'';
  formatExpression(clean);
}

function formatExpression(clean){
  let exp="", stones="", i=0, c=0;
  while(i+3<clean.length){
    let w=clean.substring(i,i+2);
    let b=clean.substring(i+2,i+4);
    exp+=w+" × "+b+" | ";
    c++;
    stones+=`<div>Stone ${c}: ${w} × ${b}</div>`;
    i+=4;
  }
  document.getElementById("expression").innerText=exp.replace(/\| $/,'');
  document.getElementById("stonesBox").innerHTML=
    c?`<b>Total Stones: ${c}</b><br>${stones}`:'';
}

function calculateInches(){
  let input=document.getElementById("rawInput").value.replace(/\D/g,'');
  totalInch=0;
  for(let i=0;i+3<input.length;i+=4){
    totalInch+=Number(input.substring(i,i+2))*Number(input.substring(i+2,i+4));
  }
  document.getElementById("inchResult").innerText="Total Inch² : "+totalInch;
}

function convertToFeet(){
  totalFeet=(totalInch/144).toFixed(2);
  document.getElementById("feetResult").innerText="Square Feet : "+totalFeet;
}

function convertToGazz(){
  totalGazz=(totalFeet/9).toFixed(2);
  document.getElementById("gazzResult").innerText="Total Gazz : "+totalGazz;
}

function calculateAmount(){
  let rate=Number(document.getElementById("rate").value);
  if(!rate) return alert("Enter rate per gazz");
  document.getElementById("amountResult").innerText=
    "Total Amount : ₹ "+(totalGazz*rate).toFixed(2);
}

function printHisaab(){
  document.getElementById("dateBox").innerText=
    "Date : "+new Date().toLocaleDateString();
  window.print();
}
</script>

</body>
</html>
